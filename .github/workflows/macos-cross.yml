name: macOS Cross (Ubuntu)
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  cross-build:
    name: cross-compile macOS universal
    runs-on: ubuntu-latest

    env:
      OSXCROSS_COMMIT: 27d21e4977c9751d01199c7a226a6faf494c3dd9
      OSXCROSS: /opt/osxcross

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and Ubuntu headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake python3 make patch xz-utils bzip2 cpio \
            libxml2-dev libssl-dev zlib1g-dev liblzma-dev libbz2-dev llvm-dev uuid-dev \
            p7zip-full zip pkg-config \
            libglib2.0-dev libjson-glib-dev libpurple-dev

      - name: Cache osxcross
        id: osxcross-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OSXCROSS }}
          key: osxcross-${{ env.OSXCROSS_COMMIT }}-sdk11.3

      - name: Download SDK and build osxcross
        if: steps.osxcross-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/osxcross/tarballs"
          git clone -q https://github.com/tpoechtrager/osxcross.git "$RUNNER_TEMP/osxcross-src"
          cd "$RUNNER_TEMP/osxcross-src"
          git checkout -q "$OSXCROSS_COMMIT"

          # 11.3 SDK provides x86_64 and arm64 (Apple Silicon)
          curl -fsSL https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz -o tarballs/MacOSX11.3.sdk.tar.xz

          sudo mkdir -p "$OSXCROSS" && sudo chown "$USER" "$OSXCROSS"
          UNATTENDED=1 BUILD_FLAVOR=stable TARGET_DIR="$OSXCROSS" \
            ENABLE_ARCHS="x86_64 arm64" ./build.sh

      - name: Add osxcross to PATH
        run: |
          echo "$OSXCROSS/bin" >> $GITHUB_PATH
          TARGET=$(basename "$(ls -1 "$OSXCROSS"/bin/x86_64-apple-darwin[0-9]*-clang | grep -v cmake | head -n 1)" | sed 's/x86_64-apple-//;s/-clang//')
          echo "Detected Darwin target: $TARGET"
          echo "DARWIN_TARGET=$TARGET" >> $GITHUB_ENV

      - name: Build plugin slices
        run: |
          GLIB_CFLAGS=$(pkg-config --cflags glib-2.0 json-glib-1.0 purple)
          COMMON_LDFLAGS="-Wl,-undefined,dynamic_lookup -Wl,-rpath,/opt/homebrew/lib -Wl,-rpath,/usr/local/lib -Wl,-rpath,/opt/local/lib"

          # 1. arm64 slice
          rm -f libteams.so libteams-personal.so
          make CC=arm64-apple-${DARWIN_TARGET}-clang \
               CFLAGS="-O2 -g -pipe $GLIB_CFLAGS" \
               LDFLAGS="$COMMON_LDFLAGS" \
               PURPLE_CFLAGS="$GLIB_CFLAGS" \
               INCLUDES="" \
               PURPLE_LIBS="-lz" \
               libteams.so libteams-personal.so
          mv libteams.so libteams_arm64.so
          mv libteams-personal.so libteams-personal_arm64.so

          # 2. x86_64 slice
          rm -f libteams.so libteams-personal.so
          make CC=x86_64-apple-${DARWIN_TARGET}-clang \
               CFLAGS="-O2 -g -pipe $GLIB_CFLAGS" \
               LDFLAGS="$COMMON_LDFLAGS" \
               PURPLE_CFLAGS="$GLIB_CFLAGS" \
               INCLUDES="" \
               PURPLE_LIBS="-lz" \
               libteams.so libteams-personal.so
          mv libteams.so libteams_x86_64.so
          mv libteams-personal.so libteams-personal_x86_64.so

      - name: Assemble fat binary
        run: |
          LIPO="$OSXCROSS/bin/lipo"
          $LIPO -create libteams_x86_64.so libteams_arm64.so -output libteams_macos.so
          $LIPO -info libteams_macos.so
          file libteams_macos.so

          $LIPO -create libteams-personal_x86_64.so libteams-personal_arm64.so -output libteams-personal_macos.so
          $LIPO -info libteams-personal_macos.so
          file libteams-personal_macos.so

      - name: Upload universal binary
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: libteams-macos-universal
          path: lib*_macos.so
